# Serialization
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

spring.kafka.producer.properties.spring.json.type.mapping=payment:com.dlt.kafka.model.PaymentEvent

# Acknowledgment Level
# 0 = No acknowledgment
# 1 = Leader acknowledgment
# all = Leader + all in-sync replicas
spring.kafka.producer.acks=all

# Retry Configuration
spring.kafka.producer.retries=5

# Enable Idempotence (avoids duplicate messages during retries)
spring.kafka.producer.properties.enable.idempotence=true

# Kafka Server/broker
spring.kafka.bootstrap-servers=localhost:9092
num.partitions=3

#############################
# Replication
#############################

default.replication.factor=3

# Minimum replicas required for ack=all
min.insync.replicas=2

# Unclean leader election disabled (recommended)
unclean.leader.election.enable=false

#############################
# Topic Management
#############################

auto.create.topics.enable=true
delete.topic.enable=true

#############################
# Controlled Shutdown
#############################

controlled.shutdown.enable=true
controlled.shutdown.max.retries=3

#############################
# Leader Rebalancing
#############################
auto.leader.rebalance.enable=true

#############################
# Consumer Offsets Topic
#############################

offsets.topic.replication.factor=3

