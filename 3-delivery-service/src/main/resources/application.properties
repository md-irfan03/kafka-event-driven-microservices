spring.application.name=springgboott13-kafka-project-delivery-service

server.port=9090

spring.config.import=classpath:producer.properties, classpath:db-hb.properties

# ==============================
# Kafka Consumer Configuration
# ==============================

# Kafka Broker
spring.kafka.bootstrap-servers=localhost:9092

# Consumer Group
spring.kafka.consumer.group-id=delivery-service

# Start from earliest available message
spring.kafka.consumer.auto-offset-reset=latest

# Key Deserializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Jackson 3 JSON Deserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer

## Trusted package for JSON deserialization
spring.kafka.consumer.properties.spring.json.trusted.packages=com.delivery.kafka.model
#
## Tell the deserializer what Java type to create
spring.kafka.consumer.properties.spring.json.value.default.type=com.delivery.kafka.model.PaymentEvent

# Do not require type information in Kafka headers
spring.kafka.consumer.properties.spring.json.use.type.headers=false

# Manual acknowledgment
spring.kafka.listener.ack-mode=record
