spring.application.name=springgboott12-kafka-project-notification-service

server.port=6060

# ==============================
# Kafka Consumer Configuration
# ==============================

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=notification-service-group
spring.kafka.consumer.auto-offset-reset=latest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer

spring.kafka.consumer.properties.spring.json.use.type.headers=true

spring.kafka.consumer.properties.spring.json.trusted.packages=com.notification.kafka.model

spring.kafka.consumer.properties.spring.json.type.mapping=payment:com.notification.kafka.model.PaymentEvent,delivery:com.notification.kafka.model.DeliveryEvent

spring.kafka.listener.ack-mode=record

#database configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/kafka
spring.datasource.username=postgres
spring.datasource.password=irfan@123
spring.datasource.driver-class-name=org.postgresql.Driver

#hibernate configuration
spring.jpa.hibernate.ddl-auto=update

#i want to check if table entity is exist or not
#spring.jpa.hibernate.ddl-auto=validate	
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect



